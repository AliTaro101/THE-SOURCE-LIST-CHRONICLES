<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RENE: SOURCE-LIST CHRONICLES — CH.3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Press Start 2P',monospace;}
#wrap{position:relative;width:960px;height:640px;border:3px solid #aaddff;

canvas{position:absolute;top:0;left:0;image-rendering:pixelated;cursor:crosshair;}

.nav-btn:hover{background:#aaddff;color:#000;box-shadow:0 0 18px #aaddff;transform:translateY(-1px);}

@keyframes pulse2{0%,100%{box-shadow:0 0 8px #ff664488;opacity:.9;}50%{box-shadow:0 0 24px #ff6644;opacity:1;}}

<body>
<div id="wrap">
  <canvas id="gc" width="960" height="640"></canvas>
  <div id="scan"></div>
  <div id="vig"></div>
  <button id="btn-menu" class="nav-btn" onclick="returnToMenu()">← MENU</button>

<script>
// ═══════════════════════════════════════════════════════════

const C=document.getElementById('gc'),X=C.getContext('2d'),W=960,H=640;
let tick=0,sfxOn=true,ac=null;

// ── LAUNCHER COMMS + PROGRESS ──────────────────────────────
function saveProgress(letter){try{const k='rene-king-progress';const cur=JSON.parse(localStorage.getItem(k)||'{"letters":[],"scores":{}}');if(!cur.letters.includes(letter))cur.letters.push(letter);cur.scores['ch3']=Math.max(cur.scores['ch3']||0,score);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem('rene-king-progress')||'{"letters":[],"scores":{}}');}catch(e){return{letters:[],scores:{}};}}
function returnToMenu(){try{window.parent.postMessage({type:'RETURN_TO_LAUNCHER',from:'chapter3'},'*');}catch(e){}window.location.href='index.html';}
function goToNextChapter(){try{window.parent.postMessage({type:'NEXT_CHAPTER',from:3,score,chillHP},'*');}catch(e){}window.location.href='rene_game_ch4.html';}
function replayChapter(){resetGame();phase='title';}
function tryAgain(){
  phase='battle';chillHP=100;portalLatency=200;score=0;consultsCompleted=0;ticketSpawned=false;ticket=null;
  activeAntons=[];P=[];PP=[];dlgQ=[];dlgC=null;loseTimer=0;shake=0;antonSpawnTimer=60;
  pDlgT=0;antonChats=[];antonChatTimer=300;
  S.lofi();
}

// ── AUDIO ──────────────────────────────────────────────────
function getAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function toggleSFX(){sfxOn=!sfxOn;document.getElementById('sfx-btn').textContent=sfxOn?'🔊 SFX':'🔇 SFX';}
function tone(f,ty,d,v=0.28,dl=0){if(!sfxOn)return;try{const a=getAC(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type=ty;o.frequency.value=f;const t=a.currentTime+dl;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.start(t);o.stop(t+d+0.05);}catch(e){}}
const S={
  click:()=>{tone(880,'sine',.07,.22);tone(1320,'sine',.06,.16,.06);tone(1760,'sine',.08,.12,.1);},
  miss:()=>{tone(280,'sawtooth',.1,.22);tone(180,'sawtooth',.08,.18,.06);},
  spawn:()=>{tone(550,'triangle',.05,.18);tone(770,'sine',.08,.14,.04);},
  teleport:()=>{tone(440,'sine',.06,.18);tone(660,'sine',.06,.14,.04);tone(880,'sine',.06,.12,.08);tone(1320,'sine',.08,.1,.12);},
  consult:()=>{tone(660,'sine',.1,.22);tone(880,'sine',.08,.18,.06);tone(1100,'sine',.06,.14,.12);},
  combo:n=>{const fs=[523,659,784,1047,1319,1568];tone(fs[Math.min(n,5)],'sine',.14,.28);},
  ticket:()=>{[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,'sine',.18,.3,i*.08));},
  teams:()=>{tone(880,'sine',.06,.18);tone(1100,'sine',.08,.14,.06);tone(660,'sine',.05,.1,.12);},
  ghost:()=>{tone(550,'triangle',.1,.18);tone(770,'sine',.08,.14,.07);tone(990,'sine',.06,.1,.14);},
  dmg:()=>{tone(220,'sawtooth',.1,.32);tone(160,'square',.07,.2,.07);},
  portalHum:()=>{tone(110,'sine',.4,.12);tone(165,'sine',.35,.1,.05);},
  frag:()=>{[262,330,392,494,659,784,1047,1318].forEach((f,i)=>tone(f,'sine',.28,.32,i*.1));},
  win:()=>{[523,587,659,784,880,784,659,587,523,659,784,1047].forEach((f,i)=>{if(f)tone(f,'square',.22,.25,i*.16);});},
  lose:()=>{[440,392,349,330,294].forEach((f,i)=>tone(f,'sawtooth',.3,.3,i*.18));},
  type:()=>{if(Math.random()<.5)tone(700+Math.random()*600,'square',.04,.04);},
  lofi:()=>{if(!sfxOn)return;try{const a=getAC(),ns=[220,247,261,293,329,349,391],pt=[0,3,5,3,0,5,3,0];
    pt.forEach((n,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    o.type='sine';o.frequency.value=ns[n]*.5;const t=a.currentTime+i*.45;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.06);g.gain.linearRampToValueAtTime(0,t+.35);
    o.start(t);o.stop(t+.45);});}catch(e){}}
};

// ── TEXT HELPERS ───────────────────────────────────────────
function txt(t,x,y,size,col,opts={}){
  const {align='center',baseline='middle',shadow=null,bold=false,bg=null,bgPad=0,border=null}=opts;
  X.save();X.textAlign=align;X.textBaseline=baseline;
  X.font=(bold?'bold ':'')+size+'px "Press Start 2P"';
  if(bg){const m=X.measureText(t);let bx=x;
    if(align==='center')bx=x-m.width/2;else if(align==='right')bx=x-m.width;
    const by=y-size/2,bw=m.width+bgPad*2,bh=size+bgPad*2;
    X.fillStyle=bg;X.fillRect(bx-bgPad,by-bgPad,bw,bh);
    if(border){X.strokeStyle=border;X.lineWidth=1;X.strokeRect(bx-bgPad,by-bgPad,bw,bh);}}
  if(shadow){X.shadowColor=shadow;X.shadowBlur=8;}
  X.fillStyle=col;X.fillText(t,x,y);X.restore();
}
function badge(t,x,y,size,col,bgCol='rgba(0,0,15,0.9)'){txt(t,x,y,size,col,{bg:bgCol,bgPad:5,border:col+'55',shadow:col,bold:true});}

// ── PARTICLES ──────────────────────────────────────────────
let P=[],PP=[];
function sParts(x,y,c,n=10,sp=3,sz=4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s2=sp*(.5+Math.random());P.push({x,y,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2,c,l:50+Math.random()*30,ml:80,sz:sz*(.5+Math.random()*.5),g:.08});}}
function sPop(x,y,t,c){PP.push({x,y,t,c,l:75,ml:75,vy:-1.3});}
function uParts(){P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.96;p.l--;});P=P.filter(p=>p.l>0);PP.forEach(p=>{p.y+=p.vy;p.l--;});PP=PP.filter(p=>p.l>0);}
function dParts(){P.forEach(p=>{X.globalAlpha=p.l/p.ml;X.fillStyle=p.c;const s=Math.round(p.sz);X.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);});X.globalAlpha=1;
  PP.forEach(p=>{X.globalAlpha=p.l/p.ml;badge(p.t,p.x,p.y,10,p.c,'rgba(0,0,12,0.85)');});X.globalAlpha=1;}

// ── GAME STATE ─────────────────────────────────────────────
let phase='title',chillHP=100,score=0,combo=0,shake=0;
let portalLatency=200,maxLatency=1400;
let consultsCompleted=0;
const CONSULTS_NEEDED=10;
let ticketSpawned=false,ticket=null;
let vTimer=0,loseTimer=0,lofiT=0,pDlgT=0;
let antonSpawnTimer=60,antonChatTimer=300;
let fragCollected=[];
let portalHum=0;

// ── ANTON STATES ──────────────────────────────────────────
let activeAntons=[];
let floatingAntons=[]; // background decorative
let peekingAntons=[]; // background decorative

const CONSULT_TEXTS=['Source-List?','Need consult!','Behind you!','Process Q?','Teams msg!','Email check?','PO escalation!','Quick Q?','Already replied!','Synced btw!','Hi I am here!','Did you see?'];

function initBgAntons(){
  floatingAntons=[
    {x:200,y:130,sz:.7,spd:.3,bob:0},
    {x:430,y:115,sz:.6,spd:.25,bob:1.2},
    {x:680,y:135,sz:.75,spd:.35,bob:2.4},
    {x:850,y:125,sz:.65,spd:.28,bob:3.6},

  peekingAntons=[
    {x:70,y:H-220,side:'left'},
    {x:W-90,y:H-200,side:'right'},
    {x:W-160,y:H-240,side:'right'},
    {x:130,y:H-250,side:'left'},

}

function spawnActiveAnton(){
  const consult=CONSULT_TEXTS[Math.floor(Math.random()*CONSULT_TEXTS.length)];
  // Spawn zones: middle area, avoiding Rene (~210) and Franka (~720)
  const zones=[
    {x:310,y:230},{x:400,y:280},{x:490,y:220},{x:560,y:290},
    {x:620,y:240},{x:340,y:340},{x:480,y:360},{x:580,y:340},
    {x:380,y:200},{x:550,y:200},{x:420,y:300},{x:520,y:260},
  ];
  const z=zones[Math.floor(Math.random()*zones.length)];
  // Tune life based on difficulty progression
  const baseLife=Math.max(48,72-Math.floor(consultsCompleted/2)*3);
  activeAntons.push({
    x:z.x+(Math.random()-.5)*40,
    y:z.y+(Math.random()-.5)*30,
    life:baseLife,maxLife:baseLife,
    consultText:consult,clicked:false,
    appearAnim:0,
  });
  S.spawn();
}

// ── ANTON TEAMS CHATS ─────────────────────────────────────
let antonChats=[];
const ANTON_MSGS=[

  "Just sent the message — also here",
  "Materialized at your desk btw",
  "Synced with the portal",
  "Need a consult? Already here",
  "PO escalation incoming — hi",

  "Portal latency rising — on it",
  "Phasing in & out — please hold",
  "Multi-instance mode activated",
  "I am everywhere. And nowhere.",
  "*ghost noises* Also FYI",
  "Teleported behind 3 people at once",

function spawnAntonChat(){
  if(antonChats.length>=2)return;
  const msg=ANTON_MSGS[Math.floor(Math.random()*ANTON_MSGS.length)];
  antonChats.push({msg,life:280,maxLife:280,slideIn:0});
  S.teams();
}

function drawAntonChats(){
  let yPos=110;
  antonChats.forEach((chat,i)=>{
    chat.slideIn=Math.min(1,chat.slideIn+0.07);
    const x=W-358+(1-chat.slideIn)*360;
    const cy=yPos+i*68;
    X.fillStyle='rgba(20,38,58,0.95)';X.fillRect(x,cy,348,58);
    X.strokeStyle='#5588cc';X.lineWidth=2;X.strokeRect(x,cy,348,58);
    X.fillStyle='#5588cc';X.fillRect(x,cy,348,3);
    X.shadowColor='#5588cc';X.shadowBlur=12;X.fillRect(x,cy,348,3);X.shadowBlur=0;
    X.fillStyle='#5b5fc7';X.fillRect(x+8,cy+10,40,40);
    X.strokeStyle='#7b80e7';X.lineWidth=1;X.strokeRect(x+8,cy+10,40,40);
    X.fillStyle='#fff';X.font='bold 20px "Press Start 2P"';X.textAlign='center';X.textBaseline='middle';X.fillText('T',x+28,cy+30);
    X.fillStyle='#88ccff';X.font='bold 8px "Press Start 2P"';X.textAlign='left';X.textBaseline='top';X.fillText('💬 ANTON (TEAMS)',x+56,cy+10);
    X.fillStyle='#ffffff';X.font='7px "Press Start 2P"';
    const maxMW=288;
    if(X.measureText(chat.msg).width<=maxMW){X.fillText(chat.msg,x+56,cy+25);}
    else{const words=chat.msg.split(' ');let ln='',ly=cy+25;
      for(let k=0;k<words.length;k++){const tl=ln+words[k]+' ';
        if(X.measureText(tl).width>maxMW&&k>0){X.fillText(ln,x+56,ly);ln=words[k]+' ';ly+=11;}else ln=tl;}X.fillText(ln,x+56,ly);}
    X.fillStyle='#88aabb';X.font='5px "Press Start 2P"';X.fillText('just now',x+56,cy+46);
    X.fillStyle='#ff4444';X.shadowColor='#ff4444';X.shadowBlur=6;X.beginPath();X.arc(x+340,cy+8,4,0,Math.PI*2);X.fill();X.shadowBlur=0;
    chat.life--;
  });
  antonChats=antonChats.filter(c=>c.life>0);
}

// ── DIALOGUE ───────────────────────────────────────────────
let dlgQ=[],dlgC=null,dlgCI=0,dlgT=0;
const DLG={
  intro:[
    {sp:'NARRATOR',col:'#ffdd00',tx:'14:30 PM. The Supply Chain Portal hums with blue electricity. The data flow ebbs and stutters. Reality glitches at the edges.'},
    {sp:'NARRATOR',col:'#ffdd00',tx:'Franka — the newest team member, already a master of her craft — stands at the holographic terminal.'},
    {sp:'FRANKA',col:'#aaccdd',tx:'Rene! Thank goodness you finished your boiled eggs. The portal is showing PHYSICAL LATENCY anomalies!'},
    {sp:'FRANKA',col:'#aaccdd',tx:'Multiple Anton manifestations detected — he is appearing FASTER than the Teams notification API. It breaks network physics!'},
    {sp:'RENE',col:'#00ffcc',tx:'*sips fresh coffee* I am aware, Franka. He appeared behind me 4 times this morning. Always 0.3 seconds after the message.'},
    {sp:'ANTON 💬',col:'#aaddff',tx:'(Teams) I just sent the message about the latency. Also — *materializes behind Rene* — I am already here.'},
    {sp:'RENE',col:'#00ffcc',tx:'*turns calmly* As predicted. Hello Anton. Also goodbye Anton. *Anton vanishes*'},
    {sp:'ALIREZA',col:'#88ccff',tx:'SENSEI! Anton just appeared in THREE different rooms at once! He is multi-instancing! It is not physically possible!'},
    {sp:'FRANKA',col:'#aaccdd',tx:'The latency is approaching 1400ms! We need to solve his consults FAST! Each ignored Anton increases portal lag!'},
    {sp:'ANTON 👻',col:'#aaddff',tx:'(floats by) Need a consult? Behind you? PO escalation? Source-List check? Email check? *flickers*'},
    {sp:'RENE',col:'#00ffcc',tx:'Patience. We will synchronize them all. *cracks knuckles* One rapid-manifestation at a time.'},
    {sp:'SYSTEM',col:'#ff6644',tx:'⚠ RAPID-CONSULT MODE ACTIVATED! Click the GLOWING Anton before he vanishes! 10 successful consults = victory!'},
  ],
  story:[
    {sp:'ANTON 💬',col:'#aaddff',tx:'(Teams) Did you try restarting? I already restarted it for you. Also: behind you.'},
    {sp:'ANTON 💬',col:'#aaddff',tx:'I replied to your email before you sent it. Saved you a step. *appears, vanishes*'},
    {sp:'RENE',col:'#00ffcc',tx:'*clicks Anton mid-bite-of-egg* Excellent. Next Anton, please. I have 6 more consults to handle.'},
    {sp:'FRANKA',col:'#aaccdd',tx:'Beautiful work, Rene! The portal latency just dropped by 200ms! Keep clicking those Antons!'},
    {sp:'ALIREZA',col:'#88ccff',tx:'Sensei... Anton just solved a Source-List issue I had NOT EVEN ENCOUNTERED YET. He pre-emptively fixed it.'},
    {sp:'RENE',col:'#00ffcc',tx:'Anton operates in causally non-linear time. We accept this. We click him. We move on.'},
    {sp:'ANTON 👻',col:'#aaddff',tx:'I am 5 places simultaneously right now. *waves from 5 directions* Hello Rene. Hello Rene. Hello Rene...'},
    {sp:'FRANKA',col:'#aaccdd',tx:'Portal stabilizing! At this rate we will retrieve the Source-List Ticket in no time!'},

    {sp:'RENE',col:'#00ffcc',tx:'Vincent has Excalibar. Alex has corner-kick goals. Anton has... omnipresence. Each one a wonder.'},
  ],
  ticket:[
    {sp:'⚡ SYSTEM',col:'#ffdd00',tx:'10 CONSULTS SOLVED! Source-List Ticket has manifested in the portal! Click it to claim Fragment N!'},
    {sp:'FRANKA',col:'#aaccdd',tx:'RENE! The ticket is materializing in the portal! Click it before the portal de-syncs!'},

  ],

    {sp:'ALIREZA',col:'#88ccff',tx:'Three letters now. K. I. N. The destiny crystallizes. KIN — like family. Like team. ONE LETTER TO GO.'},
    {sp:'SYSTEM',col:'#ffdd00',tx:'✨ FRAGMENT "N" OBTAINED! KIN — Rene\'s team-family is complete. K + I + N → one more to crown the KING. 👑'},
  ],
  lose:[

    {sp:'ANTON 💬',col:'#aaddff',tx:'(Teams) Filed the portal failure ticket. Already drafting the recovery email. Also: behind you. As always.'},

    {sp:'SYSTEM',col:'#ff6644',tx:'Click ↻ TRY AGAIN below to re-initialize the portal and resume consult synchronization!'},
  ],
};
function setDlg(k){dlgQ=[...DLG[k]];advDlg();}
function advDlg(){if(!dlgQ.length){dlgC=null;return;}dlgC=dlgQ.shift();dlgCI=0;dlgT=0;}
function pushDlg(d){dlgQ.push(d);if(!dlgC)advDlg();}

function drawDlg(){
  if(!dlgC)return;
  if(phase==='victory'&&vTimer>180)return;
  const bH=92,bY=H-bH;
  X.fillStyle='rgba(2,4,18,0.97)';X.fillRect(0,bY,W,bH);
  X.fillStyle=dlgC.col;X.fillRect(0,bY,W,4);
  X.shadowColor=dlgC.col;X.shadowBlur=12;X.fillRect(0,bY,W,4);X.shadowBlur=0;
  X.fillStyle=dlgC.col+'44';X.fillRect(0,bY+4,3,bH-4);X.fillRect(W-3,bY+4,3,bH-4);
  X.font='bold 11px "Press Start 2P"';X.textAlign='left';X.textBaseline='middle';
  const spText='['+dlgC.sp+']',spW=X.measureText(spText).width;
  X.fillStyle=dlgC.col;X.fillRect(14,bY+14,spW+20,26);

    const lv=Math.floor((loseTimer-80)/12);
    X.fillStyle='rgba(40,5,0,0.95)';X.fillRect(W/2-270,250,540,190);
    X.strokeStyle='#ff6644';X.lineWidth=2;X.strokeRect(W/2-270,250,540,190);
    X.fillStyle='#ff6644';X.fillRect(W/2-270,250,540,3);
    X.font='bold 8px "Press Start 2P"';X.textAlign='left';X.textBaseline='top';
    lines.slice(0,lv).forEach((l,i)=>{X.fillStyle=i>=lines.length-1?'#ffdd00':'#ff8844';X.fillText(l,W/2-258,268+i*22);
      if(i===lv-1&&lv<=lines.length&&Math.floor(tick/20)%2===0)X.fillText('_',W/2-258+X.measureText(l).width+4,268+i*22);});}
  if(loseTimer>180){
    txt('CONSULTS COMPLETED: '+consultsCompleted+' / '+CONSULTS_NEEDED,W/2,470,10,'#ffaa66',{align:'center',baseline:'middle',shadow:'#ff6644',bold:true});
    txt('SCORE: '+score.toString().padStart(6,'0'),W/2,495,10,'#ffdd00',{align:'center',baseline:'middle',shadow:'#ffdd00',bold:true});
    txt('🎂 Rene believes in you. So does Anton (he\'s here).',W/2,520,9,'#aaccaa',{align:'center',baseline:'middle',bold:true});}
}

// ── VICTORY (CLEAR LAYOUT) ─────────────────────────────────
function drawVictory(){
  vTimer++;
  X.fillStyle=`rgba(0,0,10,${Math.min(1,vTimer/55)*.94})`;X.fillRect(0,0,W,H);
  if(vTimer<30)return;
  if(vTimer===30){S.frag();for(let i=0;i<40;i++)sParts(W/2,H/2,['#ffdd00','#aaddff','#ff6644','#aaccff','#ff88ff'][Math.floor(Math.random()*5)],1,6+Math.random()*5,7);}
  dParts();uParts();
  const fs=Math.min(1,(vTimer-30)/35);
  if(fs>.7)txt('👑',W/2,108,28,'#ffdd00',{align:'center',baseline:'middle',shadow:'#ffdd00'});
  if(fs>0){X.save();X.translate(W/2,165);X.scale(fs,fs);
    X.shadowColor='#ffdd00';X.shadowBlur=45;X.fillStyle='#ffdd00';X.font='bold 75px "Press Start 2P"';X.textAlign='center';X.textBaseline='middle';X.fillText('N',0,0);X.shadowBlur=0;X.restore();
    txt('FRAGMENT OBTAINED',W/2,222,11,'#ffffff',{align:'center',baseline:'middle',bold:true});}
  if(vTimer>65){const ks=Math.min(1,(vTimer-65)/30);
    X.save();X.translate(W/2,260);X.scale(ks,ks);
    X.shadowColor='#ffdd00';X.shadowBlur=20;X.fillStyle='#ffdd00';X.font='bold 40px "Press Start 2P"';X.textAlign='center';X.textBaseline='middle';
    X.fillText('K  +  I  +  N',0,0);X.restore();
    txt('THREE LETTERS OF DESTINY — KIN — TEAM-FAMILY UNITED',W/2,298,9,'#88ccaa',{align:'center',baseline:'middle',bold:true});}
  if(vTimer>110){
    const lines=[
      '> PORTAL LATENCY: 50ms (NORMAL) ✓',
      '> ALL 10 CONSULTS: SOLVED ✓',
      "> SOURCE-LIST TICKET: CLAIMED ✓",
      '> ANTON: STILL EVERYWHERE (NORMAL) ✓',
      '> FRANKA STATUS: PORTAL MASTERED ✓',
      '> KIN: COMPLETE — ONE LETTER LEFT ✓',
      '> CHAPTER 3: COMPLETE',
    ];
    const lv=Math.floor((vTimer-110)/12);
    X.fillStyle='rgba(0,8,20,0.95)';X.fillRect(W/2-225,318,450,148);
    X.strokeStyle='#aaddff';X.lineWidth=2;X.strokeRect(W/2-225,318,450,148);
    X.fillStyle='#aaddff';X.fillRect(W/2-225,318,450,3);
    X.font='bold 8px "Press Start 2P"';X.textAlign='left';X.textBaseline='top';
    lines.slice(0,lv).forEach((l,i)=>{X.fillStyle=i>=lines.length-1?'#ffdd00':'#aaddff';X.fillText(l,W/2-213,332+i*19);
      if(i===lv-1&&lv<=lines.length&&Math.floor(tick/20)%2===0)X.fillText('_',W/2-213+X.measureText(l).width+4,332+i*19);});}
  if(vTimer>200){
    const cr=chillHP>80?'LEGENDARY ★★★★★':chillHP>60?'EXCELLENT ★★★★':chillHP>40?'GOOD ★★★':chillHP>20?'OK ★★':'SURVIVED ★';
    txt('FINAL SCORE: '+score.toString().padStart(6,'0'),W/2,490,13,'#ffdd00',{align:'center',baseline:'middle',shadow:'#ffdd00',bold:true});
    txt('CHILL RATING: '+cr,W/2,517,10,'#aaddff',{align:'center',baseline:'middle',shadow:'#aaddff',bold:true});
    txt('🎂 Happy Birthday Rene — 3 down, 1 to go! 🎂',W/2,545,9,'#aaccaa',{align:'center',baseline:'middle',bold:true});}
}

// ── INPUT ──────────────────────────────────────────────────
C.addEventListener('click',e=>{getAC();const r=C.getBoundingClientRect();handleClick((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();getAC();
  if(phase==='intro'||phase==='battle'||phase==='lose'){handleClick(W/2,H-40);}}});

function handleClick(mx,my){
  if(phase==='title'){phase='intro';setDlg('intro');S.lofi();return;}
  if(phase==='intro'){
    if(dlgC){if(dlgCI<dlgC.tx.length)dlgCI=dlgC.tx.length;
      else{advDlg();if(!dlgC){phase='battle';S.lofi();S.portalHum();antonSpawnTimer=30;antonChatTimer=200;}}}return;}
  if(phase==='battle'){
    // Check ticket click
    if(ticketSpawned&&ticket&&!ticket.clicked){
      const dx=mx-ticket.x,dy=my-(ticket.y+ticket.bob);
      if(Math.abs(dx)<50&&Math.abs(dy)<40){
        ticket.clicked=true;
        sParts(ticket.x,ticket.y,'#ffdd00',30,6,7);
        sPop(ticket.x,ticket.y-30,'TICKET CLAIMED!','#ffdd00');
        S.ticket();
        setTimeout(()=>trigWin(),900);return;}}
    // Check Anton clicks
    let hit=false;
    activeAntons.forEach(a=>{
      if(a.clicked)return;
      const dx=mx-a.x,dy=my-(a.y-35);
      if(dx*dx+dy*dy<45*45){
        a.clicked=true;hit=true;
        consultsCompleted++;score+=100*(1+Math.floor(consultsCompleted/3));
        combo++;
        sParts(a.x,a.y-30,'#aaddff',16,4,5);
        const pt=combo>5?'⚡ x'+combo+'!':combo>3?'CONSULT!':'SYNCED!';
        sPop(a.x,a.y-70,pt,'#aaddff');
        S.click();S.consult();S.combo(combo-1);
        portalLatency=Math.max(50,portalLatency-80);
        chillHP=Math.min(100,chillHP+4);
        pDlgT++;
        if(pDlgT%3===0&&storyCount<DLG.story.length){pushDlg(DLG.story[storyCount%DLG.story.length]);storyCount++;}
        // Trigger ticket spawn
        if(consultsCompleted>=CONSULTS_NEEDED&&!ticketSpawned){
          ticketSpawned=true;ticket={x:240,y:H-280,bob:0,clicked:false};
          setDlg('ticket');S.ticket();
          for(let i=0;i<25;i++)sParts(240,H-280,['#ffdd00','#aaddff'][Math.floor(Math.random()*2)],1,5,5);
        }}});
    if(!hit){combo=0;}
    if(dlgC&&dlgCI>=dlgC.tx.length&&my>H-95)advDlg();
    return;}
  if(phase==='lose'){if(dlgC&&dlgCI<dlgC.tx.length)dlgCI=dlgC.tx.length;else if(dlgC)advDlg();return;}
  if(phase==='victory'&&vTimer>270)return;
}

let storyCount=0;

function trigWin(){
  phase='victory';vTimer=0;fragCollected.push('N');S.win();setDlg('victory');
  saveProgress('N');
  for(let i=0;i<6;i++)setTimeout(()=>sParts(Math.random()*W,Math.random()*(H*.65),['#ffdd00','#aaddff','#ff6644'][Math.floor(Math.random()*3)],18,5,7),i*200);
}
function trigLose(){
  phase='lose';loseTimer=0;S.lose();setDlg('lose');
  for(let i=0;i<3;i++)setTimeout(()=>sParts(Math.random()*W,Math.random()*(H*.6),'#ff4444',12,4,5),i*150);
}
function resetGame(){
  chillHP=100;score=0;combo=0;shake=0;portalLatency=200;consultsCompleted=0;
  ticketSpawned=false;ticket=null;
  vTimer=0;loseTimer=0;lofiT=0;pDlgT=0;storyCount=0;
  activeAntons=[];P=[];PP=[];dlgC=null;dlgQ=[];fragCollected=[];
  antonSpawnTimer=60;antonChatTimer=300;antonChats=[];
  initBgAntons();
}

function updateButtons(){
  const btnNext=document.getElementById('btn-next'),btnReplay=document.getElementById('btn-replay'),btnMenu=document.getElementById('btn-menu'),btnTry=document.getElementById('btn-tryagain'),hint=document.getElementById('click-hint');
  btnNext.style.display=(phase==='victory'&&vTimer>240)?'block':'none';
  btnReplay.style.display=(phase==='victory'&&vTimer>240)?'block':'none';
  btnTry.style.display=(phase==='lose'&&loseTimer>200)?'block':'none';
  btnMenu.style.display=phase==='title'?'none':'block';
  hint.style.display=(phase==='battle'&&consultsCompleted===0&&activeAntons.length>0)?'block':'none';
}

// ── UPDATE ─────────────────────────────────────────────────
function update(){
  tick++;if(shake>0)shake-=.5;
  if(phase==='battle'){
    // Spawn active Antons
    antonSpawnTimer++;
    const maxConcurrent=consultsCompleted<3?1:consultsCompleted<7?2:3;
    const spawnRate=Math.max(35,80-Math.floor(consultsCompleted/2)*4);
    if(antonSpawnTimer>=spawnRate&&activeAntons.filter(a=>!a.clicked).length<maxConcurrent&&!ticketSpawned){
      antonSpawnTimer=0;spawnActiveAnton();}
    // Update active Antons
    activeAntons.forEach(a=>{
      if(!a.clicked){a.life--;
        if(a.life<=0){a.clicked=true;
          portalLatency=Math.min(maxLatency,portalLatency+90);
          chillHP=Math.max(0,chillHP-7);shake=4;
          sPop(a.x,a.y-30,'MISSED!','#ff4422');
          S.miss();
          if(chillHP<=0){trigLose();return;}}}});
    activeAntons=activeAntons.filter(a=>!a.clicked||a.life>-30);
    // Latency drift (slowly increases over time)
    if(tick%30===0)portalLatency=Math.min(maxLatency,portalLatency+8);
    if(chillHP<=0){trigLose();return;}
    // Anton Teams chats (frequent in Ch3)
    antonChatTimer++;
    const acRate=consultsCompleted>5?160:240;
    if(antonChatTimer>=acRate){antonChatTimer=0;spawnAntonChat();}
    lofiT++;if(lofiT>=370){lofiT=0;S.lofi();}
  }
  uParts();updateButtons();
}

function render(){
  X.save();if(shake>0)X.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  X.clearRect(-12,-12,W+24,H+24);
  if(phase==='title'){drawTitle();X.restore();return;}
  if(phase==='intro'){drawIntroScene(tick);drawHUD();drawDlg();X.restore();return;}
  if(phase==='battle'){drawBattleScene(tick);dParts();drawHUD();drawAntonChats();drawDlg();X.restore();return;}
  if(phase==='lose'){drawBattleScene(tick);dParts();drawHUD();drawLose();drawDlg();X.restore();return;}
  if(phase==='victory'){drawBattleScene(tick);dParts();drawHUD();drawVictory();drawDlg();X.restore();return;}
  X.restore();
}
function loop(){update();render();requestAnimationFrame(loop);}
initTS();initBgAntons();loop();
</script>
