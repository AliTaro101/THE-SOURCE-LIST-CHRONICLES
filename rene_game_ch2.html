<style>

body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Press Start 2P',monospace;}

canvas{position:absolute;top:0;left:0;image-rendering:pixelated;cursor:pointer;}

#btn-menu{top:10px;left:10px;border-color:#88aabb;color:#88aabb;font-size:7px;padding:6px 10px;}

@keyframes pulse{0%,100%{box-shadow:0 0 8px #ffdd0088;}50%{box-shadow:0 0 22px #ffdd00;}}
@keyframes pulse2{0%,100%{opacity:0.7;}50%{opacity:1;}}

  <canvas id="gc" width="960" height="640"></canvas>

<script>
// ═══════════════════════════════════════════════════════════
//   RENE: THE SOURCE-LIST CHRONICLES
//   CHAPTER 2: THE GODZILLA-JESUS PARADOX
// ═══════════════════════════════════════════════════════════
const C=document.getElementById('gc'),X=C.getContext('2d'),W=960,H=640;
let tick=0,sfxOn=true,ac=null;

// ── LAUNCHER COMMS + PROGRESS ──────────────────────────────
function saveProgress(letter){try{const k='rene-king-progress';const cur=JSON.parse(localStorage.getItem(k)||'{"letters":[],"scores":{}}');if(!cur.letters.includes(letter))cur.letters.push(letter);cur.scores['ch2']=Math.max(cur.scores['ch2']||0,score);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem('rene-king-progress')||'{"letters":[],"scores":{}}');}catch(e){return{letters:[],scores:{}};}}
function returnToMenu(){try{window.parent.postMessage({type:'RETURN_TO_LAUNCHER',from:'chapter2'},'*');}catch(e){}window.location.href='index.html';}
function goToNextChapter(){try{window.parent.postMessage({type:'NEXT_CHAPTER',from:2,score,chillHP},'*');}catch(e){}window.location.href='rene_game_ch3.html';}
function replayChapter(){resetGame();phase='title';}

// ── AUDIO ──────────────────────────────────────────────────
function getAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function toggleSFX(){sfxOn=!sfxOn;document.getElementById('sfx-btn').textContent=sfxOn?'🔊 SFX':'🔇 SFX';}
function tone(f,ty,d,v=0.28,dl=0){if(!sfxOn)return;try{const a=getAC(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type=ty;o.frequency.value=f;const t=a.currentTime+dl;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.start(t);o.stop(t+d+0.05);}catch(e){}}
const S={
  jump:()=>{tone(440,'square',.08,.22);tone(660,'square',.06,.16,.06);tone(880,'sine',.1,.12,.1);},
  dblJump:()=>{tone(660,'square',.06,.22);tone(990,'square',.06,.18,.05);tone(1320,'sine',.1,.16,.1);},
  hit:()=>{tone(180,'sawtooth',.18,.38);tone(110,'sawtooth',.12,.28,.08);},
  dmg:()=>{tone(220,'sawtooth',.1,.32);tone(160,'square',.07,.2,.07);},
  coffee:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,'sine',.12,.2,i*.05));},
  combo:n=>{const fs=[523,659,784,1047,1319,1568];tone(fs[Math.min(n,5)],'sine',.14,.28);},
  story:()=>{tone(330,'triangle',.15,.18);tone(440,'triangle',.12,.14,.1);tone(550,'sine',.18,.12,.2);},
  frag:()=>{[262,330,392,494,659,784,1047,1318].forEach((f,i)=>tone(f,'sine',.28,.32,i*.1));},
  win:()=>{[523,587,659,784,880,784,659,587,523,659,784,1047].forEach((f,i)=>{if(f)tone(f,'square',.22,.25,i*.16);});},
  ferrari:()=>{tone(90,'sawtooth',.6,.32);tone(110,'sawtooth',.4,.28,.1);},
  baguette:()=>{tone(280,'triangle',.1,.22);tone(220,'sawtooth',.08,.15,.06);},
  tennis:()=>{tone(880,'sine',.06,.2);tone(440,'sine',.04,.15,.06);},
  tire:()=>{tone(150,'sawtooth',.12,.28);tone(120,'sawtooth',.1,.2,.06);},
  type:()=>{if(Math.random()<.5)tone(700+Math.random()*600,'square',.04,.04);},
  roar:()=>{tone(70,'sawtooth',.55,.4);tone(50,'sawtooth',.4,.32,.06);},
  lofi:()=>{if(!sfxOn)return;try{const a=getAC(),ns=[220,247,261,293,329,349,391],pt=[0,2,4,2,5,3,2,0];
    pt.forEach((n,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    o.type='sine';o.frequency.value=ns[n]*.5;const t=a.currentTime+i*.45;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.06);g.gain.linearRampToValueAtTime(0,t+.35);
    o.start(t);o.stop(t+.45);});}catch(e){}}
};

// ── TEXT HELPERS ───────────────────────────────────────────
function txt(t,x,y,size,col,opts={}){
  const {align='center',baseline='middle',shadow=null,bold=false,bg=null,bgPad=0,border=null}=opts;
  X.save();X.textAlign=align;X.textBaseline=baseline;
  X.font=(bold?'bold ':'')+size+'px "Press Start 2P"';
  if(bg){const m=X.measureText(t);let bx=x;
    if(align==='center')bx=x-m.width/2;else if(align==='right')bx=x-m.width;
    const by=y-size/2,bw=m.width+bgPad*2,bh=size+bgPad*2;
    X.fillStyle=bg;X.fillRect(bx-bgPad,by-bgPad,bw,bh);
    if(border){X.strokeStyle=border;X.lineWidth=1;X.strokeRect(bx-bgPad,by-bgPad,bw,bh);}}
  if(shadow){X.shadowColor=shadow;X.shadowBlur=8;}
  X.fillStyle=col;X.fillText(t,x,y);X.restore();
}
function badge(t,x,y,size,col,bgCol='rgba(0,0,15,0.9)'){txt(t,x,y,size,col,{bg:bgCol,bgPad:5,border:col+'55',shadow:col,bold:true});}

// ── PARTICLES ──────────────────────────────────────────────
let P=[],PP=[];
function sParts(x,y,c,n=10,sp=3,sz=4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s2=sp*(.5+Math.random());P.push({x,y,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2,c,l:50+Math.random()*30,ml:80,sz:sz*(.5+Math.random()*.5),g:.12});}}
function sPop(x,y,t,c){PP.push({x,y,t,c,l:75,ml:75,vy:-1.3});}
function uParts(){P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.96;p.l--;});P=P.filter(p=>p.l>0);PP.forEach(p=>{p.y+=p.vy;p.l--;});PP=PP.filter(p=>p.l>0);}
function dParts(){P.forEach(p=>{X.globalAlpha=p.l/p.ml;X.fillStyle=p.c;const s=Math.round(p.sz);X.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);});X.globalAlpha=1;
  PP.forEach(p=>{X.globalAlpha=p.l/p.ml;badge(p.t,p.x,p.y,10,p.c,'rgba(0,0,12,0.85)');});X.globalAlpha=1;}

// ── GAME STATE ─────────────────────────────────────────────
let phase='title',chillHP=100,score=0,combo=0,shake=0;
let distance=0,distanceGoal=900;
let bgScroll=0,beltOffset=0;
let storyCount=0,obsHit=0,obsAvoid=0,coffeeCount=0;
let slowMoTimer=0;
let vTimer=0,finalCutTimer=0;
let lofiT=0,pDlgT=0;

// ── RENE PHYSICS ───────────────────────────────────────────
const GROUND_Y=H-150;
const JUMP_F=-15,GRAV=0.72,DBL_JUMP_F=-12;
let reneX=240,reneY=GROUND_Y,reneVY=0;
let onGround=true,jumpCount=0;
let runFrame=0;

function doJump(){
  if(onGround){reneVY=JUMP_F;onGround=false;jumpCount=1;S.jump();
    sParts(reneX,GROUND_Y,'#aaddff',6,2,3);}
  else if(jumpCount<2){reneVY=DBL_JUMP_F;jumpCount=2;S.dblJump();
    sParts(reneX,reneY,'#aaddff',10,3,4);sPop(reneX,reneY-30,'DOUBLE!','#ffdd00');}
}

// ── BUTTONS ────────────────────────────────────────────────
function updateButtons(){
  const btnNext=document.getElementById('btn-next'),btnReplay=document.getElementById('btn-replay'),btnMenu=document.getElementById('btn-menu'),hint=document.getElementById('jump-hint');
  if(phase==='victory'&&vTimer>240){btnNext.style.display='block';btnReplay.style.display='block';}
  else{btnNext.style.display='none';btnReplay.style.display='none';}
  btnMenu.style.display=phase==='title'?'none':'block';
  hint.style.display=(phase==='battle'&&distance<60)?'block':'none';
}

// ── DIALOGUE ───────────────────────────────────────────────
let dlgQ=[],dlgC=null,dlgCI=0,dlgT=0;
const DLG={
  intro:[
    {sp:'NARRATOR',col:'#ffdd00',tx:'09:15 AM. Two and a half hours after Rene\'s morning beer. The team has arrived. Reality begins to bend...'},
    {sp:'NARRATOR',col:'#ffdd00',tx:'At the coffee station, near the server room, something impossibly weird is about to happen. As usual.'},

    {sp:'VINCENT',col:'#88ff44',tx:'For SCIENCE Alireza! Also — I had a pet MONKEY in my childhood in Africa! You laughed! *shows photo* THERE I AM WITH THE MONKEY!'},
    {sp:'ALIREZA',col:'#88ccff',tx:'He has a photo. With the monkey. Vincent knows EVERYTHING. Every impossible thing is TRUE. He IS our Jesus.'},
    {sp:'ALEX',col:'#ff9900',tx:'GOOOOAL!! I scored from a CORNER KICK yesterday! ALSO — MY BABY DAUGHTER IS COMING SOON! BABY ALEX 2.0!'},
    {sp:'ADITYA',col:'#ff4444',tx:'VROOOOM! Ferrari! Tennis after work, Alex?! I have my racket ready! Forza Supply Chain GP!'},
    {sp:'VINCENT',col:'#88ff44',tx:'Also — ze server is crashing. I think my halo overloaded ze data stream. SORRY MY FRIENDS!'},

  stories:[

  ],
  finalCut:[

  ],
  victory:[
    {sp:'RENE',col:'#00ffcc',tx:'*lands perfectly* The reality vortex closes. The server resets. Vincent\'s hair has stopped overloading the data stream.'},
    {sp:'VINCENT',col:'#88ff44',tx:'I told you ze atomic breath would help! Did I tell you I once met a saint in Bordeaux? He blessed my baguette...'},
    {sp:'ALIREZA',col:'#88ccff',tx:'Vincent told FOUR impossible stories. All TRUE. Excalibar. Skeleton. Monkey. Lightning. He is our Godzilla-Jesus.'},
    {sp:'RENE',col:'#00ffcc',tx:'Vincent is the wisest among us. He has touched skeletons. Found Excalibar. Befriended monkeys. We listen.'},

};
function setDlg(k){dlgQ=[...DLG[k]];advDlg();}
function advDlg(){if(!dlgQ.length){dlgC=null;return;}dlgC=dlgQ.shift();dlgCI=0;dlgT=0;}
function pushDlg(d){dlgQ.push(d);if(!dlgC)advDlg();}
function drawDlg(){
  if(!dlgC)return;
  const bH=92,bY=H-bH;
  X.fillStyle='rgba(2,4,18,0.97)';X.fillRect(0,bY,W,bH);
  X.fillStyle=dlgC.col;X.fillRect(0,bY,W,4);
  X.shadowColor=dlgC.col;X.shadowBlur=12;X.fillRect(0,bY,W,4);X.shadowBlur=0;
  X.fillStyle=dlgC.col+'44';X.fillRect(0,bY+4,3,bH-4);X.fillRect(W-3,bY+4,3,bH-4);
  X.font='bold 11px "Press Start 2P"';X.textAlign='left';X.textBaseline='middle';
  const spText='['+dlgC.sp+']',spW=X.measureText(spText).width;
  X.fillStyle=dlgC.col;X.fillRect(14,bY+14,spW+20,26);
  X.fillStyle='rgba(0,0,12,0.95)';X.fillRect(16,bY+16,spW+16,22);
  X.fillStyle=dlgC.col;X.shadowColor=dlgC.col;X.shadowBlur=8;X.fillText(spText,24,bY+27);X.shadowBlur=0;
  const disp=dlgC.tx.slice(0,dlgCI);
  X.fillStyle='#ffffff';X.font='9px "Press Start 2P"';X.textBaseline='top';
  const words=disp.split(' '),maxTW=W-40;
  let line='',ly=bY+50;
  for(let i=0;i<words.length;i++){const tl=line+words[i]+' ';if(X.measureText(tl).width>maxTW&&i>0){X.fillText(line,20,ly);line=words[i]+' ';ly+=18;if(ly>H-12)break;}else line=tl;}
  X.fillText(line,20,ly);
  dlgT++;if(dlgT%2===0&&dlgCI<dlgC.tx.length){dlgCI++;if(dlgCI%3===0)S.type();}
  if(dlgCI>=dlgC.tx.length&&Math.floor(tick/22)%2===0)badge('▼ CLICK / SPACE TO CONTINUE',W-140,bY+bH-14,7,'#88ff44','rgba(0,15,5,0.95)');
}

// ── OBSTACLES ──────────────────────────────────────────────
let obstacles=[],coffees=[];
let obsTimer=0,coffeeTimer=0;
let baseSpeed=4.2;
let curSpeed=baseSpeed;

function spawnObs(){
  const types=['baguette','tennis','tire'];
  const t=types[Math.floor(Math.random()*3)];
  const spd=curSpeed*(slowMoTimer>0?.45:1);
  if(t==='baguette'){
    obstacles.push({type:'baguette',x:W+30,y:GROUND_Y-32-Math.random()*15,vx:-spd*1.1,w:54,h:14,spin:0,col:'#cc9944'});
    S.baguette();
  }else if(t==='tennis'){
    obstacles.push({type:'tennis',x:W+30,y:GROUND_Y-8,vx:-spd*1.2,vy:-8,w:20,h:20,col:'#aaff44',bouncing:true});
    S.tennis();
  }else{
    obstacles.push({type:'tire',x:W+30,y:GROUND_Y-16,vx:-spd*1.5,w:32,h:32,col:'#1a1a1a',roll:0});
    S.tire();
  }
}
function spawnCoffee(){
  coffees.push({x:W+30,y:GROUND_Y-90-Math.random()*30,vx:-curSpeed,collected:false,bob:Math.random()*Math.PI*2});
}
function drawObstacle(o){
  if(o.type==='baguette'){
    // Baguette with spin
    o.spin+=.15;
    X.save();X.translate(o.x,o.y);X.rotate(o.spin);
    X.fillStyle='#cc9944';X.fillRect(-25,-6,50,12);
    X.fillStyle='#aa7733';X.fillRect(-25,-6,50,3);
    X.fillStyle='#ddaa55';X.fillRect(-23,-3,46,2);
    // Bread cuts
    X.fillStyle='#885522';
    for(let i=0;i<4;i++)X.fillRect(-18+i*10,-5,2,10);
    // End rounding
    X.fillStyle='#bb8844';X.fillRect(-27,-5,3,10);X.fillRect(24,-5,3,10);
    X.restore();
    X.shadowColor='#000';X.shadowBlur=8;
    X.fillStyle='rgba(0,0,0,0.4)';X.beginPath();X.ellipse(o.x,GROUND_Y+4,24,4,0,0,Math.PI*2);X.fill();X.shadowBlur=0;
  }else if(o.type==='tennis'){
    // Bouncing tennis ball
    if(o.bouncing){o.vy+=GRAV*.55;o.y+=o.vy;
      if(o.y>=GROUND_Y-8){o.y=GROUND_Y-8;o.vy=-9*.85;}}
    X.shadowColor='#aaff44';X.shadowBlur=10;
    X.fillStyle='#bbff55';X.beginPath();X.arc(o.x,o.y,11,0,Math.PI*2);X.fill();
    X.fillStyle='#99dd33';X.beginPath();X.arc(o.x+2,o.y+2,8,0,Math.PI*2);X.fill();
    // Tennis ball lines
    X.strokeStyle='#fff';X.lineWidth=1.5;
    X.beginPath();X.arc(o.x,o.y,11,Math.PI*.2,Math.PI*.8);X.stroke();
    X.beginPath();X.arc(o.x,o.y,11,Math.PI*1.2,Math.PI*1.8);X.stroke();
    X.shadowBlur=0;

function handleClick(){
  if(phase==='title'){phase='intro';setDlg('intro');S.lofi();return;}
  if(phase==='intro'){
    if(dlgC){if(dlgCI<dlgC.tx.length)dlgCI=dlgC.tx.length;
      else{advDlg();if(!dlgC){phase='battle';S.lofi();S.roar();}}}return;}
  if(phase==='battle'){doJump();
    if(dlgC&&dlgCI>=dlgC.tx.length)advDlg();return;}
  if(phase==='finalCut'){
    if(finalCutTimer>120)doJump();
    if(dlgC&&dlgCI>=dlgC.tx.length)advDlg();
    return;}
  if(phase==='victory'&&vTimer>270)return;
}
function trigWin(){
  phase='victory';vTimer=0;fragCollected.push('I');S.win();setDlg('victory');
  saveProgress('I');
  for(let i=0;i<6;i++)setTimeout(()=>sParts(Math.random()*W,Math.random()*(H*.65),['#ffdd00','#88ff44','#ff6644'][Math.floor(Math.random()*3)],18,5,7),i*200);
}
function resetGame(){
  chillHP=100;score=0;combo=0;shake=0;distance=0;storyCount=0;obsHit=0;obsAvoid=0;coffeeCount=0;
  slowMoTimer=0;vTimer=0;finalCutTimer=0;lofiT=0;pDlgT=0;
  obstacles=[];coffees=[];P=[];PP=[];dlgC=null;dlgQ=[];fragCollected=[];
  reneX=240;reneY=GROUND_Y;reneVY=0;onGround=true;jumpCount=0;curSpeed=baseSpeed;
}

// ── UPDATE ─────────────────────────────────────────────────
function update(){
  tick++;if(shake>0)shake-=.5;if(slowMoTimer>0)slowMoTimer--;
  // Rene physics
  if(phase==='battle'||phase==='finalCut'){
    reneVY+=GRAV;reneY+=reneVY;
    if(reneY>=GROUND_Y){reneY=GROUND_Y;reneVY=0;onGround=true;jumpCount=0;}
    else onGround=false;
  }
  if(phase==='battle'){
    const sm=slowMoTimer>0?.45:1;
    distance+=curSpeed*sm/8;
    score=Math.floor(distance*2)+obsAvoid*10+coffeeCount*100;
    curSpeed=baseSpeed+Math.floor(distance/120)*.4;
    // Spawn obstacles
    obsTimer++;
    const oRate=Math.max(45,90-Math.floor(distance/60)*3);
    if(obsTimer>=oRate){obsTimer=0;spawnObs();}
    // Spawn coffees
    coffeeTimer++;
    if(coffeeTimer>=350){coffeeTimer=0;spawnCoffee();}
    // Update obstacles
    obstacles.forEach(o=>{o.x+=o.vx*sm;
      // Collision with Rene
      const dx=Math.abs(reneX-o.x),dy=Math.abs(reneY-o.y);
      const hitW=o.w/2+10,hitH=o.h/2+25;
      if(dx<hitW&&dy<hitH&&!o.hit){o.hit=true;
        chillHP=Math.max(0,chillHP-13);shake=8;S.dmg();S.hit();obsHit++;
        sParts(reneX,reneY-30,'#ff4400',12,3,4);
        sPop(reneX,reneY-70,'OUCH!','#ff4400');
        if(chillHP<=0){chillHP=1;/*don't game over, just clamp*/}}
      // Passed without hit
      if(o.x<reneX-50&&!o.hit&&!o.passed){o.passed=true;obsAvoid++;score+=50;
        if(obsAvoid%5===0)sPop(reneX,reneY-90,'NICE!','#88ff44');}});
    obstacles=obstacles.filter(o=>o.x>-80);
    // Coffee collection
    coffees.forEach(c=>{c.x+=c.vx*sm;
      if(!c.collected){const dx=Math.abs(reneX-c.x),dy=Math.abs(reneY-c.y);
        if(dx<28&&dy<50){c.collected=true;coffeeCount++;slowMoTimer=180;S.coffee();
          sParts(c.x,c.y,'#cc8844',16,4,5);sPop(c.x,c.y-20,'☕ SLOW-MO!','#ffdd00');}}});
    coffees=coffees.filter(c=>c.x>-50&&!c.collected||(c.collected&&Math.abs(c.x-reneX)>200));
    // Periodic stories
    pDlgT++;
    if(pDlgT>=180){pDlgT=0;
      if(storyCount<DLG.stories.length){pushDlg(DLG.stories[storyCount%DLG.stories.length]);storyCount++;S.story();}}
    // Win condition
    if(distance>=distanceGoal){phase='finalCut';finalCutTimer=0;setDlg('finalCut');}
    // Lofi
    lofiT++;if(lofiT>=370){lofiT=0;S.lofi();}
  }
  if(phase==='finalCut'){
    if(finalCutTimer>180&&jumpCount>=2&&!onGround){
      // Player did double-jump after racket — VICTORY!
      trigWin();
    }
    // Auto-trigger if takes too long
    if(finalCutTimer>360){trigWin();}
  }
  uParts();updateButtons();
}

function render(){
  X.save();if(shake>0)X.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  X.clearRect(-12,-12,W+24,H+24);
  if(phase==='title'){drawTitle();X.restore();return;}
  if(phase==='intro'){drawIntroScene(tick);drawHUD();drawDlg();X.restore();return;}
  if(phase==='battle'){drawBattleScene(tick);dParts();drawHUD();drawDlg();X.restore();return;}
  if(phase==='finalCut'){drawFinalCutscene(tick);dParts();drawHUD();drawDlg();X.restore();return;}
  if(phase==='victory'){drawBattleScene(tick);dParts();drawHUD();drawVictory();drawDlg();X.restore();return;}
  X.restore();
}
function loop(){update();render();requestAnimationFrame(loop);}
initTS();loop();
</script>
