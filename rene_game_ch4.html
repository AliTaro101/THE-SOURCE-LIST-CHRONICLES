<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RENE: SOURCE-LIST CHRONICLES — CH.4 FINALE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Press Start 2P',monospace;}
#wrap{position:relative;width:960px;height:640px;border:3px solid #ffdd00;
  box-shadow:0 0 50px #ffdd0044,0 0 100px #ffdd0022,inset 0 0 30px #1a0a0040;overflow:hidden;background:#000;}
canvas{position:absolute;top:0;left:0;image-rendering:pixelated;cursor:crosshair;}
#scan{position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);
  pointer-events:none;z-index:20;}
#vig{position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,0.45) 100%);
  pointer-events:none;z-index:19;}
.nb{position:absolute;font-family:'Press Start 2P',monospace;font-size:9px;
  background:rgba(0,0,18,0.92);border:2px solid #ffdd00;color:#ffdd00;
  padding:9px 14px;cursor:pointer;z-index:60;letter-spacing:1px;
  transition:all 0.15s;text-transform:uppercase;}
.nb:hover{background:#ffdd00;color:#000;box-shadow:0 0 18px #ffdd00;transform:translateY(-1px);}
.nb:active{transform:translateY(0);}
#bm{top:10px;left:10px;border-color:#88aabb;color:#88aabb;font-size:7px;padding:6px 10px;}
#bm:hover{background:#88aabb;color:#000;box-shadow:0 0 12px #88aabb;}
#bf{bottom:18px;right:18px;border-color:#ffdd00;color:#ffdd00;display:none;font-size:10px;
  animation:gp 1.5s infinite;}
#bf:hover{background:#ffdd00;color:#000;box-shadow:0 0 22px #ffdd00;}
#br{bottom:18px;left:18px;border-color:#aaddff;color:#aaddff;display:none;}
#br:hover{background:#aaddff;color:#000;}
#bt{bottom:18px;left:50%;transform:translateX(-50%);border-color:#ff6644;color:#ff6644;
  display:none;font-size:12px;padding:11px 22px;animation:gp2 1.2s infinite;}
#bt:hover{background:#ff6644;color:#000;box-shadow:0 0 22px #ff6644;}
#bs{top:10px;right:10px;font-size:7px;padding:6px 10px;border-color:#ffdd0066;color:#ffdd00;}
@keyframes gp{0%,100%{box-shadow:0 0 8px #ffdd0088;}50%{box-shadow:0 0 25px #ffdd00;}}
@keyframes gp2{0%,100%{box-shadow:0 0 8px #ff664488;}50%{box-shadow:0 0 24px #ff6644;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gc" width="960" height="640"></canvas>
  <div id="scan"></div>
  <div id="vig"></div>
  <button id="bm" class="nb" onclick="goMenu()">← MENU</button>
  <button id="bs" class="nb" onclick="toggleSFX()">🔊 SFX</button>
  <button id="br" class="nb" onclick="resetGame()">↻ REPLAY</button>
  <button id="bf" class="nb" onclick="goFinish()">🎂 BIRTHDAY HUB ▶</button>
  <button id="bt" class="nb" onclick="tryAgain()">↻ TRY AGAIN</button>
</div>
<script>
// ═══════════════════════════════════════════════════════════
//   RENE: THE SOURCE-LIST CHRONICLES
//   CHAPTER 4 (FINALE): THE FEAST OF THE GOLDEN RIB
// ═══════════════════════════════════════════════════════════
const C=document.getElementById('gc'),X=C.getContext('2d'),W=960,H=640;
let tick=0,sfxOn=true,ac=null;

// ── PROGRESS + NAVIGATION ──────────────────────────────────
function saveProgress(letter){try{const k='rene-king-progress';const cur=JSON.parse(localStorage.getItem(k)||'{"letters":[],"scores":{}}');if(!cur.letters.includes(letter))cur.letters.push(letter);cur.scores['ch4']=Math.max(cur.scores['ch4']||0,score);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem('rene-king-progress')||'{"letters":[],"scores":{}}');}catch(e){return{letters:[],scores:{}};}}
function goMenu(){
  try{window.parent.postMessage({type:'RETURN_TO_LAUNCHER',from:'chapter4'},'*');}catch(e){}
  window.location.href='index.html';
}
function goFinish(){
  try{window.parent.postMessage({type:'GAME_COMPLETE',score,chillHP},'*');}catch(e){}
  window.location.href='index.html';
}
function toggleSFX(){sfxOn=!sfxOn;document.getElementById('bs').textContent=sfxOn?'🔊 SFX':'🔇 SFX';}

// ── AUDIO ──────────────────────────────────────────────────
function getAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function tone(f,ty,d,v=0.28,dl=0){if(!sfxOn)return;try{const a=getAC(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type=ty;o.frequency.value=f;const tm=a.currentTime+dl;
  g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(v,tm+0.01);g.gain.exponentialRampToValueAtTime(0.001,tm+d);
  o.start(tm);o.stop(tm+d+0.05);}catch(e){}}
const S={
  click:()=>{tone(660,'square',.07,.22);tone(900,'square',.07,.16,.06);tone(1200,'sine',.1,.1,.1);},
  gold:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,'sine',.12,.25,i*.04));},
  chaos:()=>{tone(200,'sawtooth',.12,.32);tone(140,'sawtooth',.1,.24,.06);},
  chill:()=>{tone(330,'sine',.15,.22);tone(440,'sine',.12,.18,.1);tone(550,'triangle',.18,.14,.2);},
  early:()=>{tone(880,'square',.06,.24);tone(1320,'square',.06,.22,.05);tone(1760,'sine',.15,.2,.1);tone(2200,'sine',.18,.18,.18);},
  shield:()=>{[392,494,587,659,784].forEach((f,i)=>tone(f,'sine',.18,.22,i*.05));},
  bossAtk:()=>{tone(110,'sawtooth',.25,.4);tone(80,'sawtooth',.2,.34,.08);tone(60,'square',.15,.28,.16);},
  bossRoar:()=>{tone(80,'sawtooth',.6,.4);tone(60,'sawtooth',.45,.34,.08);tone(45,'sawtooth',.4,.3,.18);},
  phaseShift:()=>{[140,180,240,320,420,560].forEach((f,i)=>tone(f,'sawtooth',.18,.3,i*.07));},
  combo:n=>{const fs=[523,659,784,1047,1319,1568,2093];tone(fs[Math.min(n,6)],'sine',.14,.28);},
  dmg:()=>{tone(220,'sawtooth',.1,.32);tone(160,'square',.07,.2,.07);},
  frag:()=>{[262,330,392,494,659,784,1047,1318,1568].forEach((f,i)=>tone(f,'sine',.3,.32,i*.08));},
  king:()=>{const m=[523,659,784,1047,1319,1568,2093,2637];m.forEach((f,i)=>{tone(f,'sine',.4,.32,i*.18);tone(f*.5,'triangle',.5,.2,i*.18+.3);});},
  win:()=>{[523,587,659,784,880,1047,880,784,659,587,523,659,784,1047,1319,1568,2093].forEach((f,i)=>{if(f)tone(f,'square',.22,.27,i*.14);});},
  lose:()=>{[440,392,349,330,294,262].forEach((f,i)=>tone(f,'sawtooth',.3,.3,i*.18));},
  type:()=>{if(Math.random()<.5)tone(700+Math.random()*600,'square',.04,.04);},
  heartbeat:()=>{tone(60,'sine',.18,.32);tone(50,'sine',.12,.24,.22);},
  lofi:()=>{if(!sfxOn)return;try{const a=getAC(),ns=[220,247,261,293,329,349,391],pt=[0,4,5,4,0,5,4,0];
    pt.forEach((n,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    o.type='sine';o.frequency.value=ns[n]*.5;const tm=a.currentTime+i*.45;
    g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(.07,tm+.06);g.gain.linearRampToValueAtTime(0,tm+.35);
    o.start(tm);o.stop(tm+.45);});}catch(e){}}
};

// ── TEXT HELPERS ───────────────────────────────────────────
function txt(s,x,y,sz,col,opts={}){
  const{align='center',base='middle',shadow=null,bold=false,bg=null,bpad=4,border=null}=opts;
  X.save();X.textAlign=align;X.textBaseline=base;X.font=(bold?'bold ':'')+sz+'px "Press Start 2P"';
  if(bg){const m=X.measureText(s);let bx=x;if(align==='center')bx=x-m.width/2;else if(align==='right')bx=x-m.width;
    X.fillStyle=bg;X.fillRect(bx-bpad,y-sz/2-bpad,m.width+bpad*2,sz+bpad*2);
    if(border){X.strokeStyle=border;X.lineWidth=1;X.strokeRect(bx-bpad,y-sz/2-bpad,m.width+bpad*2,sz+bpad*2);}}
  if(shadow){X.shadowColor=shadow;X.shadowBlur=8;}
  X.fillStyle=col;X.fillText(s,x,y);X.restore();
}
function badge(s,x,y,sz,col,bg='rgba(0,0,12,0.9)'){txt(s,x,y,sz,col,{bg,bpad:5,border:col+'55',shadow:col,bold:true});}

// ── PARTICLES ──────────────────────────────────────────────
let P=[],PP=[];
function sp(x,y,c,n=10,spd=3,sz=4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.5+Math.random());P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,l:50+Math.random()*30,ml:80,sz:sz*(.5+Math.random()*.5),g:.08});}}
function pop(x,y,s,c){PP.push({x,y,s,c,l:80,ml:80,vy:-1.3});}
function upP(){P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.96;p.l--;});P=P.filter(p=>p.l>0);PP.forEach(p=>{p.y+=p.vy;p.l--;});PP=PP.filter(p=>p.l>0);}
function dpP(){P.forEach(p=>{X.globalAlpha=p.l/p.ml;X.fillStyle=p.c;const s=Math.round(p.sz);X.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);});X.globalAlpha=1;
  PP.forEach(p=>{X.globalAlpha=p.l/p.ml;badge(p.s,p.x,p.y,10,p.c,'rgba(0,0,12,0.85)');});X.globalAlpha=1;}

// ── GAME STATE ─────────────────────────────────────────────
let phase='title';
let chillHP=100,bossHP=100,bossEgo=100,score=0,combo=0,shake=0;
let bossPhase=1,phaseShiftAnim=0;
let bossDefeated=false,bossDefeatedAt=0;
let finalGAppeared=false,finalG=null,fragCollected=[];
let vTimer=0,loseTimer=0,kingTimer=0,credTimer=0,lofiT=0,pDlgT=0,storyI=0;
let bossAtkTimer=300,bossAtkAnim=0;
let rageMode=false,rageT=0;

// ── ABILITIES ──────────────────────────────────────────────
const AB={
  chill:{cd:0,max:240,name:'CHILL STARE',desc:'Lower Boss Ego • -8 HP',dmg:8,col:'#aaddff'},
  early:{cd:0,max:420,name:'EARLY BIRD STRIKE',desc:'Massive damage • -32 HP',dmg:32,col:'#ffdd00'},
  shield:{cd:0,max:480,name:'KIP SATE SHIELD',desc:'Regen Chill • +32 HP',heal:32,col:'#88ff44'},
};
const ABKEYS=['chill','early','shield'];
const AX=[15,335,655];

function useAB(k){
  const a=AB[k];if(a.cd>0||phase!=='battle'||bossDefeated)return;
  if(k==='chill'){
    bossHP=Math.max(0,bossHP-a.dmg);bossEgo=Math.max(0,bossEgo-22);S.chill();
    sp(W/2,200,'#aaddff',20,4,6);pop(W/2,250,'CHILL STARE! -'+a.dmg,'#aaddff');score+=60;
    pDlgT++;if(pDlgT%3===0&&storyI<DLG.story.length){pushDlg(DLG.story[storyI]);storyI++;}
  }
  if(k==='early'){
    bossHP=Math.max(0,bossHP-a.dmg);S.early();shake=14;
    for(let i=0;i<30;i++)sp(W/2,200,Math.random()<.5?'#ffdd00':'#fff',1,7,7);
    pop(W/2,250,'EARLY BIRD! -'+a.dmg,'#ffdd00');score+=200;
    pDlgT++;if(pDlgT%3===0&&storyI<DLG.story.length){pushDlg(DLG.story[storyI]);storyI++;}
  }
  if(k==='shield'){
    chillHP=Math.min(100,chillHP+a.heal);S.shield();
    sp(450,H-165,'#88ff44',20,4,5);pop(450,H-220,'+'+a.heal+' CHILL 🛡','#88ff44');score+=40;
  }
  a.cd=a.max;
  checkPhaseShift();
  if(bossHP<=0&&!bossDefeated)defeatBoss();
}

// ── PHASE SHIFTS ───────────────────────────────────────────
function checkPhaseShift(){
  const oldP=bossPhase;
  if(bossHP<=66&&bossPhase<2)bossPhase=2;
  if(bossHP<=33&&bossPhase<3){bossPhase=3;rageMode=true;rageT=0;}
  if(bossPhase!==oldP){
    phaseShiftAnim=60;S.phaseShift();S.bossRoar();shake=18;
    for(let i=0;i<40;i++)sp(W/2,200,'#ff2200',1,6,7);
    if(bossPhase===2){
      pushDlg({sp:'⚡ BOSS PHASE 2',col:'#ff8800',tx:'THE SPREADSHEET ENRAGES! Sate-storm intensifies — chaos ribs spawn faster!'});
      pushDlg(DLG.phase2[Math.floor(Math.random()*DLG.phase2.length)]);
    }
    if(bossPhase===3){
      pushDlg({sp:'⚡ FINAL PHASE',col:'#ff2200',tx:'RAGE MODE! The Boss\'s last stand! Cooldowns are halved — UNLEASH EVERYTHING!'});
      pushDlg(DLG.phase3[Math.floor(Math.random()*DLG.phase3.length)]);
      ABKEYS.forEach(k=>{AB[k].max=Math.floor(AB[k].max*0.55);if(AB[k].cd>AB[k].max)AB[k].cd=AB[k].max;});
    }
  }
}

// ── BATTLE GRID ────────────────────────────────────────────
const GX=265,GY=415,GW=430,GH=108,GC=7,GR=2;
const CW=GW/GC,CH=GH/GR;
let goldRibs=[],chaosRibs=[],goldTimer=0,chaosTimer=0;

function gPos(c,r){return{x:GX+c*CW+CW/2,y:GY+r*CH+CH/2};}
function spawnGold(){
  if(goldRibs.length>=(bossPhase>=2?3:2)||bossDefeated)return;
  let c,r,tries=0;
  do{c=Math.floor(Math.random()*GC);r=Math.floor(Math.random()*GR);tries++;}
  while(tries<8&&(goldRibs.some(g=>g.c===c&&g.r===r)||chaosRibs.some(g=>g.c===c&&g.r===r)));
  const life=bossPhase===1?80:bossPhase===2?68:56;
  goldRibs.push({c,r,life,ml:life,appear:0,clicked:false});
}
function spawnChaos(){
  if(chaosRibs.length>=(bossPhase===3?4:bossPhase===2?3:2)||bossDefeated)return;
  let c,r,tries=0;
  do{c=Math.floor(Math.random()*GC);r=Math.floor(Math.random()*GR);tries++;}
  while(tries<8&&(goldRibs.some(g=>g.c===c&&g.r===r)||chaosRibs.some(g=>g.c===c&&g.r===r)));
  chaosRibs.push({c,r,life:bossPhase===3?130:160,clicked:false});
}

function drawGrid(){
  const containerCol=bossPhase===1?'#aa44dd':bossPhase===2?'#dd6633':'#ff2200';
  X.fillStyle='rgba(18,10,28,0.88)';X.fillRect(GX,GY,GW,GH);
  X.shadowColor=containerCol;X.shadowBlur=12;X.strokeStyle=containerCol;X.lineWidth=2;X.strokeRect(GX,GY,GW,GH);X.shadowBlur=0;
  X.strokeStyle=containerCol+'55';X.lineWidth=1;
  for(let c=1;c<GC;c++){X.beginPath();X.moveTo(GX+c*CW,GY);X.lineTo(GX+c*CW,GY+GH);X.stroke();}
  X.beginPath();X.moveTo(GX,GY+CH);X.lineTo(GX+GW,GY+CH);X.stroke();
  for(let c=0;c<GC;c++)for(let r=0;r<GR;r++){
    const{x,y}=gPos(c,r);
    X.fillStyle='#3a2030';X.fillRect(x-CW/2+2,y-CH/2+2,CW-4,CH-4);
    X.fillStyle='#552240';X.fillRect(x-CW/2+2,y-CH/2+2,CW-4,3);
    X.fillStyle='#221422';X.font='4px monospace';X.textAlign='center';X.textBaseline='middle';
    X.fillText('row '+(r+1),x,y-4);X.fillText('col '+(c+1),x,y+5);
  }
  chaosRibs.forEach(g=>{
    if(g.clicked)return;
    const{x,y}=gPos(g.c,g.r);
    X.shadowColor='#ff2222';X.shadowBlur=14+Math.sin(tick*.15)*4;
    X.fillStyle='#bb1122';X.fillRect(x-CW/2+2,y-CH/2+2,CW-4,CH-4);
    X.fillStyle='#ff3344';X.fillRect(x-CW/2+2,y-CH/2+2,CW-4,4);
    X.fillStyle='#550011';for(let i=0;i<5;i++)X.fillRect(x-CW/2+6+i*10,y-CH/2+8,4,CH-16);
    X.shadowBlur=0;
    X.fillStyle='#ff4455';X.font='bold 6px "Press Start 2P"';X.textAlign='center';X.textBaseline='middle';
    X.fillText('CHAOS!',x,y+10);
    g.life--;
  });
  chaosRibs=chaosRibs.filter(g=>!g.clicked&&g.life>0);
  goldRibs.forEach(g=>{
    if(g.clicked)return;
    g.appear=Math.min(20,g.appear+1);
    const{x,y}=gPos(g.c,g.r);
    const ap=g.appear/20,lp=g.life/g.ml;
    X.globalAlpha=ap;
    X.shadowColor='#ffdd00';X.shadowBlur=22+Math.sin(tick*.12)*7;
    X.fillStyle='#ffdd00';X.fillRect(x-CW/2+2,y-CH/2+2,CW-4,CH-4);
    X.fillStyle='#ffee55';X.fillRect(x-CW/2+2,y-CH/2+2,CW-4,4);
    X.fillStyle='#cc8800';X.fillRect(x-CW/2+2,y+CH/2-6,CW-4,4);
    X.fillStyle='#ffffcc';for(let i=0;i<5;i++)X.fillRect(x-CW/2+6+i*10,y-CH/2+8,4,CH-16);
    X.shadowBlur=0;
    X.strokeStyle='#ff4422';X.lineWidth=3;X.shadowColor='#ff4422';X.shadowBlur=8;
    X.beginPath();X.arc(x,y,CW/2-2,-Math.PI/2,-Math.PI/2+lp*Math.PI*2);X.stroke();X.shadowBlur=0;
    X.fillStyle='#330000';X.font='bold 5px "Press Start 2P"';X.textAlign='center';X.textBaseline='middle';
    X.fillText('★ GOLD ★',x,y+11);
    X.globalAlpha=1;
    g.life--;
  });
  goldRibs=goldRibs.filter(g=>!g.clicked&&g.life>0);
  badge('THE BATTLE GRID — CLICK GOLD, AVOID CHAOS',GX+GW/2,GY-11,7,containerCol,'rgba(20,0,30,0.95)');
  const lx=80,lw=170;
  X.fillStyle='rgba(8,18,8,0.88)';X.fillRect(lx,GY,lw,GH);
  X.strokeStyle='#88ff44';X.lineWidth=2;X.shadowColor='#88ff44';X.shadowBlur=8;X.strokeRect(lx,GY,lw,GH);X.shadowBlur=0;
  for(let c=0;c<5;c++)for(let r=0;r<3;r++){
    const px=lx+8+c*32,py=GY+12+r*30;
    X.fillStyle='#8a4422';X.fillRect(px,py,26,16);
    X.fillStyle='#aa5533';X.fillRect(px,py,26,3);
    X.fillStyle='#552211';for(let i=0;i<4;i++)X.fillRect(px+2+i*6,py+5,3,9);
  }
  badge("SOURCE-LIST: RENE'S WORK",lx+lw/2,GY-11,6,'#88ff44','rgba(0,20,5,0.95)');
}

// ── ABILITY CARDS ──────────────────────────────────────────
const CY=348,CW2=290,CH2=54;
function drawABCards(){
  ABKEYS.forEach((k,i)=>{
    const a=AB[k],ready=a.cd<=0,x=AX[i];
    X.fillStyle=ready?'rgba(20,14,4,0.95)':'rgba(12,12,12,0.92)';X.fillRect(x,CY,CW2,CH2);
    X.strokeStyle=ready?a.col:a.col+'44';X.lineWidth=ready?2.5:1.5;
    X.shadowColor=ready?a.col:'transparent';X.shadowBlur=ready?(14+Math.sin(tick*.1+i)*4):0;
    X.strokeRect(x,CY,CW2,CH2);X.shadowBlur=0;
    const icons=['👁','⚡','🛡'];
    X.font='bold 18px "Press Start 2P"';X.textAlign='center';X.textBaseline='middle';
    X.fillText(icons[i],x+28,CY+CH2/2);
    X.fillStyle=ready?a.col:'#555';X.font='bold 9px "Press Start 2P"';X.textAlign='left';X.textBaseline='middle';
    if(ready){X.shadowColor=a.col;X.shadowBlur=4;}X.fillText(a.name,x+55,CY+18);X.shadowBlur=0;
    X.fillStyle=ready?'#bbb':'#555';X.font='7px "Press Start 2P"';X.fillText(a.desc,x+55,CY+38);
    X.fillStyle=ready?'#fff':'#444';X.font='bold 8px "Press Start 2P"';X.textAlign='center';X.textBaseline='middle';
    X.fillText('['+(i+1)+']',x+CW2-20,CY+CH2/2);
    if(!ready){
      const cdp=a.cd/a.max;
      X.fillStyle='rgba(0,0,0,0.65)';X.fillRect(x,CY,CW2*cdp,CH2);
      X.fillStyle='#ff6644';X.font='bold 10px "Press Start 2P"';X.textAlign='right';X.textBaseline='middle';
      X.fillText(Math.ceil(a.cd/60)+'s',x+CW2-10,CY+CH2/2);
    } else if(Math.floor(tick/15)%2===0){
      X.fillStyle=a.col;X.font='bold 7px "Press Start 2P"';X.textAlign='right';X.textBaseline='middle';
      X.fillText('READY!',x+CW2-10,CY+CH2/2);
    }
  });
}

// ── BOSS ───────────────────────────────────────────────────
function drawBoss(){
  if(bossDefeated&&tick-bossDefeatedAt>90)return;
  const cx=W/2,cy=195;

  CREDS.forEach(c=>{
    if(c.s&&yPos>58&&yPos<H-10)txt(c.s,W/2,yPos,c.sz||9,c.c||'#fff',{align:'center',base:'middle',shadow:c.c,bold:c.b||false});
    yPos+=(c.sz||9)+9;
  });
  dpP();upP();
  if(credTimer%48===0)for(let i=0;i<6;i++)sp(Math.random()*W,-10,['#ffdd00','#ff4422','#aaddff','#88ff44','#ff88ff'][Math.floor(Math.random()*5)],1,3,5);
  if(Math.floor(credTimer/50)%2===0&&credTimer<3800)badge('CLICK TO SKIP TO BIRTHDAY HUB',W/2,H-18,7,'#ffdd00','rgba(40,30,0,0.95)');
  if(credTimer>3800)document.getElementById('bf').style.display='block';
}

// ── BUTTONS ────────────────────────────────────────────────
function updateBtns(){
  const bm=document.getElementById('bm'),br=document.getElementById('br'),bt=document.getElementById('bt'),bf=document.getElementById('bf');
  bm.style.display=phase==='title'?'none':'block';
  br.style.display=phase==='credits'&&credTimer>3800?'block':'none';
  bt.style.display=(phase==='lose'&&loseTimer>200)?'block':'none';
  if(phase!=='credits'||credTimer<=3800)bf.style.display='none';
}

// ── INPUT ──────────────────────────────────────────────────
C.addEventListener('click',e=>{
  getAC();const r=C.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  handleClick(mx,my);
});
document.addEventListener('keydown',e=>{
  getAC();
  if(e.code==='Digit1')useAB('chill');
  if(e.code==='Digit2')useAB('early');
  if(e.code==='Digit3')useAB('shield');
  if(e.code==='Space'){e.preventDefault();handleClick(W/2,H-40);}
});

function handleClick(mx,my){
  if(phase==='title'){phase='intro';setDlg('intro');S.lofi();return;}
  if(phase==='intro'){
    if(dlgC){
      if(dlgCI<dlgC.tx.length)dlgCI=dlgC.tx.length;
      else{advDlg();if(!dlgC){phase='battle';S.lofi();S.bossRoar();bossAtkTimer=300;goldTimer=60;}}
    }
    return;
  }
  if(phase==='battle'){
    if(finalGAppeared&&finalG&&!finalG.clicked){
      const dx=mx-finalG.x,dy=my-(finalG.y+finalG.bob);
      if(Math.abs(dx)<70&&Math.abs(dy)<50){
        finalG.clicked=true;fragCollected.push('G');
        saveProgress('G');
        sp(finalG.x,finalG.y,'#ffdd00',60,8,9);
        for(let i=0;i<30;i++)sp(finalG.x,finalG.y,'#fff',1,5,6);
        pop(finalG.x,finalG.y-30,'KING ACHIEVED!','#ffdd00');
        S.frag();S.king();
        setTimeout(()=>{phase='victory';vTimer=0;setDlg('victory');},900);
        return;
      }
    }
    for(let i=0;i<ABKEYS.length;i++){
      const x=AX[i];
      if(mx>=x&&mx<=x+CW2&&my>=CY&&my<=CY+CH2){useAB(ABKEYS[i]);return;}
    }
    let hit=false;
    goldRibs.forEach(g=>{
      if(g.clicked)return;
      const{x,y}=gPos(g.c,g.r);
      if(Math.abs(mx-x)<CW/2-3&&Math.abs(my-y)<CH/2-3){
        g.clicked=true;hit=true;
        const baseDmg=10+(bossPhase-1)*2;
        bossHP=Math.max(0,bossHP-baseDmg);score+=80*(1+Math.floor(combo/3));combo++;
        bossEgo=Math.max(0,bossEgo-3);
        sp(x,y,'#ffdd00',16,4,6);pop(x,y-30,'GOLD! -'+baseDmg,'#ffdd00');
        S.gold();S.combo(combo-1);
        pDlgT++;if(pDlgT%5===0&&storyI<DLG.story.length){pushDlg(DLG.story[storyI]);storyI++;}
        checkPhaseShift();
        if(bossHP<=0&&!bossDefeated)defeatBoss();
      }
    });
    chaosRibs.forEach(c=>{
      if(c.clicked)return;
      const{x,y}=gPos(c.c,c.r);
      if(Math.abs(mx-x)<CW/2-3&&Math.abs(my-y)<CH/2-3){
        c.clicked=true;hit=true;
        chillHP=Math.max(0,chillHP-12);shake=8;S.chaos();combo=0;
        sp(x,y,'#ff4422',12,3,5);pop(x,y-30,'CHAOS! -12','#ff4422');
        if(chillHP<=0){phase='lose';loseTimer=0;S.lose();setDlg('lose');}
      }
    });
    if(!hit)combo=0;
    if(dlgC&&dlgCI>=dlgC.tx.length&&my>H-95)advDlg();
    return;
  }
  if(phase==='lose'){
    if(dlgC&&dlgCI<dlgC.tx.length)dlgCI=dlgC.tx.length;
    else if(dlgC)advDlg();
    return;
  }
  if(phase==='victory'){
    if(dlgC&&dlgCI<dlgC.tx.length)dlgCI=dlgC.tx.length;
    else if(dlgC)advDlg();
    return;
  }
  if(phase==='kingReveal'){
    if(kingTimer>360)kingTimer=480;
    return;
  }
  if(phase==='credits'){credTimer=Math.max(credTimer,3850);return;}
}

function defeatBoss(){
  bossDefeated=true;bossDefeatedAt=tick;rageMode=false;
  S.bossRoar();shake=22;
  for(let i=0;i<60;i++)sp(W/2,200,['#ff2200','#ffdd00','#fff','#ff8800'][Math.floor(Math.random()*4)],1,7,8);
  setTimeout(()=>{
    finalGAppeared=true;
    finalG={x:W/2,y:230,appear:0,bob:0,clicked:false};
    setDlg('finalG');
    S.frag();
  },1400);
}

function tryAgain(){
  phase='battle';chillHP=100;bossHP=100;bossEgo=100;score=0;combo=0;shake=0;
  bossPhase=1;phaseShiftAnim=0;rageMode=false;rageT=0;
  bossDefeated=false;bossDefeatedAt=0;finalGAppeared=false;finalG=null;fragCollected=[];
  goldRibs=[];chaosRibs=[];goldTimer=60;chaosTimer=0;loseTimer=0;
  P=[];PP=[];dlgQ=[];dlgC=null;pDlgT=0;storyI=0;
  AB.chill.max=240;AB.early.max=420;AB.shield.max=480;
  AB.chill.cd=0;AB.early.cd=0;AB.shield.cd=0;
  bossAtkTimer=300;S.lofi();S.bossRoar();
}
function resetGame(){resetFull();phase='title';}
function resetFull(){
  phase='title';chillHP=100;bossHP=100;bossEgo=100;score=0;combo=0;shake=0;
  bossPhase=1;phaseShiftAnim=0;rageMode=false;rageT=0;
  bossDefeated=false;bossDefeatedAt=0;finalGAppeared=false;finalG=null;fragCollected=[];
  goldRibs=[];chaosRibs=[];goldTimer=0;chaosTimer=0;
  vTimer=0;loseTimer=0;kingTimer=0;credTimer=0;lofiT=0;pDlgT=0;storyI=0;
  P=[];PP=[];dlgQ=[];dlgC=null;
  AB.chill.max=240;AB.early.max=420;AB.shield.max=480;
  AB.chill.cd=0;AB.early.cd=0;AB.shield.cd=0;
}

// ── UPDATE ─────────────────────────────────────────────────
function update(){
  tick++;
  if(shake>0)shake-=.5;
  if(phaseShiftAnim>0)phaseShiftAnim--;
  if(bossAtkAnim>0)bossAtkAnim--;
  ABKEYS.forEach(k=>{if(AB[k].cd>0)AB[k].cd--;});
  if(phase==='battle'&&!bossDefeated){
    goldTimer++;
    const gr=Math.max(36,80-Math.floor((100-bossHP)/12)*5);
    if(goldTimer>=gr){goldTimer=0;spawnGold();}
    chaosTimer++;
    const cr=bossPhase===1?180:bossPhase===2?140:115;
    if(chaosTimer>=cr){chaosTimer=0;spawnChaos();}
    bossAtkTimer--;
    if(bossAtkTimer<=0){
      bossAtkTimer=Math.max(180,300-Math.floor((100-bossHP)/8)*10);
      const atkDmg=8+Math.floor((100-bossHP)/30)*3;
      chillHP=Math.max(0,chillHP-atkDmg);shake=8;S.bossAtk();bossAtkAnim=22;
      sp(450,H-165,'#ff4422',10,4,5);pop(450,H-220,'BOSS ATTACK! -'+atkDmg,'#ff4422');
      if(chillHP<=0){phase='lose';loseTimer=0;S.lose();setDlg('lose');}
    }
    lofiT++;if(lofiT>=370){lofiT=0;S.lofi();}
    if(chillHP<25&&tick%48===0)S.heartbeat();
  }
  upP();updateBtns();
}

// ── RENDER ─────────────────────────────────────────────────
function render(){
  X.save();
  if(shake>0)X.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  X.clearRect(-12,-12,W+24,H+24);
  if(phase==='title'){drawTitle();dpP();X.restore();return;}
  if(phase==='intro'){drawBG();drawTeam();drawBoss();drawPOE();drawRene();dpP();drawHUD();drawDlg();X.restore();return;}
  if(phase==='battle'){drawBG();drawTeam();drawBoss();drawPOE();drawRene();drawGrid();drawABCards();if(finalGAppeared)drawFinalG();dpP();drawHUD();drawDlg();X.restore();return;}
  if(phase==='lose'){drawBG();drawTeam();drawBoss();drawPOE();drawRene();drawGrid();drawABCards();dpP();drawHUD();drawLose();drawDlg();X.restore();return;}
  if(phase==='victory'){drawBG();drawTeam();drawPOE();drawRene();dpP();drawHUD();drawVictory();drawDlg();X.restore();return;}
  if(phase==='kingReveal'){drawKingReveal();X.restore();return;}
  if(phase==='credits'){drawCredits();X.restore();return;}
  X.restore();
}
function loop(){update();render();requestAnimationFrame(loop);}
initStars();loop();
</script>
